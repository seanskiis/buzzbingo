<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BuzzBingo</title>
    <meta
      name="description"
      content="A shared board for tracking corporate buzzwords in the wild."
    >
    <link rel="icon" href="favicon-16.png?v=1.3.0" type="image/png" sizes="16x16">
    <link rel="icon" href="favicon-32.png?v=1.3.0" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon.png?v=1.3.0" type="image/png" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.3.0">
    <link rel="stylesheet" href="styles.css?v=1.3.0">
  </head>
  <body>
    <header class="app-header" aria-label="BuzzBingo">
      <a class="app-logo" href="./" aria-label="BuzzBingo home">
        <img src="buzzbingo-header-logo.png?v=1.3.0" alt="BuzzBingo">
      </a>
    </header>

    <main class="counter-shell">
      <section class="counter-panel" aria-labelledby="pageTitle">
        <div class="label-row">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="connectionStatus">Connecting</span>
        </div>

        <p class="phrase-kicker">Today's buzzword is</p>
        <h1 id="pageTitle"><span id="phraseLabel">Force Multiplier</span></h1>
        <p class="subtitle">
          Click the button whenever the buzzword enters the room.
        </p>

        <div class="tally-wrap" aria-live="polite">
          <span class="tally-label">Total</span>
          <strong id="countDisplay" class="tally">-</strong>
        </div>

        <button id="countButton" class="count-button" type="button" disabled>
          <span class="button-icon" aria-hidden="true">+</span>
          <span>I HEARD IT!</span>
        </button>

        <p id="helperText" class="helper-text">
          Shared tally loads once Firebase is configured.
        </p>
      </section>

      <section class="history-panel" aria-labelledby="historyTitle">
        <div class="section-heading">
          <p class="history-kicker">Archive</p>
          <h2 id="historyTitle">Previous buzzwords</h2>
        </div>
        <div id="historyList" class="history-list" aria-live="polite">
          <p class="history-empty">Previous daily totals will appear here.</p>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>
        Built by
        <a href="https://github.com/seanskiis" rel="me">Seanskiis</a>
        &amp; Codex
      </span>
      <span class="version-pill">v<span id="appVersion">...</span></span>
    </footer>

    <script src="firebase-config.js"></script>
    <script src="version.js?v=1.3.0"></script>
    <script type="module" src="app.js?v=1.3.0"></script>
  </body>
</html>
