<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BuzzBingo</title>
    <meta
      name="description"
      content="A shared board for tracking corporate buzzwords in the wild."
    >
    <link rel="icon" href="favicon-16.png?v=1.6.0" type="image/png" sizes="16x16">
    <link rel="icon" href="favicon-32.png?v=1.6.0" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon.png?v=1.6.0" type="image/png" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.6.0">
    <link rel="stylesheet" href="styles.css?v=1.6.0">
  </head>
  <body>
    <header class="app-header" aria-label="BuzzBingo">
      <a class="app-logo" href="./" aria-label="BuzzBingo home">
        <img src="buzzbingo-header-logo.png?v=1.6.0" alt="BuzzBingo">
      </a>
    </header>

    <main class="counter-shell">
      <section class="card-stage" aria-label="Daily buzzword cards">
        <article id="prevPreviewCard" class="preview-card preview-card-left" aria-hidden="true"></article>
        <article id="nextPreviewCard" class="preview-card preview-card-right" aria-hidden="true"></article>

        <section class="counter-panel" aria-labelledby="pageTitle">
          <div class="label-row">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="connectionStatus">Connecting</span>
          </div>

          <p id="cardDateLabel" class="phrase-kicker">Today's buzzword is</p>
          <h1 id="pageTitle"><span id="phraseLabel">Force Multiplier</span></h1>
          <p id="cardInstruction" class="subtitle">
            Click the button whenever the buzzword enters the room.
          </p>

          <div class="tally-wrap" aria-live="polite">
            <span class="tally-label">Total</span>
            <strong id="countDisplay" class="tally">-</strong>
          </div>

          <button id="countButton" class="count-button" type="button" disabled>
            <span class="button-icon" aria-hidden="true">+</span>
            <span>I HEARD IT!</span>
          </button>

          <p id="helperText" class="helper-text">
            Shared tally loads once Firebase is configured.
          </p>
        </section>

        <button id="carouselPrev" class="stage-nav stage-nav-left" type="button" aria-label="Previous day">‹</button>
        <button id="carouselNext" class="stage-nav stage-nav-right" type="button" aria-label="Next day">›</button>
      </section>
    </main>

    <footer class="app-footer">
      <span>
        Built by
        <a href="https://github.com/seanskiis" rel="me">Seanskiis</a>
        &amp; Codex
      </span>
      <span class="version-pill">v<span id="appVersion">...</span></span>
    </footer>

    <script src="firebase-config.js"></script>
    <script src="version.js?v=1.6.0"></script>
    <script type="module" src="app.js?v=1.6.0"></script>
  </body>
</html>
